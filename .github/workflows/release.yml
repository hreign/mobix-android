name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifacts
        run: pnpm run build:publish

      - name: Publish to npm
        run: npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package zip distribution
        run: |
          mkdir -p mobix-app/app/dist
          mkdir -p mobix-app/app/public
          cp -r app/dist/* mobix-app/app/dist/
          cp -r app/public/* mobix-app/app/public/
          cp package.json mobix-app/package.json
          cd mobix-app
          npm install --omit=dev
          cd ..
          zip -r mobix-app.zip mobix-app

      - name: Get release description
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --force

          echo "Tag: $TAG_NAME"
          echo "Tag type: $(git cat-file -t "refs/tags/$TAG_NAME")"

          TAG_TYPE=$(git cat-file -t "refs/tags/$TAG_NAME")

          if [ "$TAG_TYPE" = "tag" ]; then
            git for-each-ref \
              "refs/tags/$TAG_NAME" \
              --format='%(contents)' \
              > release-body.md
          else
            git log -1 --pretty=%B "$TAG_NAME" > release-body.md
          fi

          echo "Release body:"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: mobix-app.zip
          body_path: release-body.md
          generate_release_notes: false
          draft: false
          prerelease: false
